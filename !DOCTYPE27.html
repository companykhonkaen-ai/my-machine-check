<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QC Audit Standard Table - โต๊ะที่ 27</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        :root {
            --primary: #1F4E79;
            --primary-dark: #123352;
            --primary-light: #F0F4F8;
            --success: #2e7d32;
            --text-main: #1e293b;
            --bg-body: #f8fafc;
            --border-color: #cbd5e1;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 30px 15px; padding-bottom: 120px; }
        
        .container { max-width: 1280px; margin: 0 auto; }
        
        .main-header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #ffffff; padding: 25px; border-radius: 20px; text-align: center; box-shadow: var(--card-shadow); margin-bottom: 25px; }
        .main-header h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; }
        
        .meta-card { background: #ffffff; border-radius: 20px; padding: 25px; box-shadow: var(--card-shadow); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 600px) { .form-grid { grid-template-columns: 1fr 1fr; } }
        
        .field-group { display: flex; flex-direction: column; }
        .field-group label { font-size: 0.95rem; font-weight: 600; color: var(--primary); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .field-group input { padding: 14px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 1rem; background-color: #ffffff; }
        .field-group input:focus { border-color: var(--primary); outline: none; }

        .sheet-edit-card { background: #ffffff; border-radius: 20px; padding: 25px; box-shadow: var(--card-shadow); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .sheet-edit-card h3 { font-size: 1.15rem; color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
        
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; border: 1px solid var(--border-color); }
        .interactive-table { width: 100%; border-collapse: collapse; min-width: 1200px; text-align: center; background: #ffffff; }
        .interactive-table th { background-color: #f1f5f9; color: var(--primary-dark); font-weight: 700; font-size: 0.95rem; padding: 16px 10px; border: 1px solid var(--border-color); }
        .interactive-table td { padding: 10px 8px; border: 1px solid var(--border-color); vertical-align: middle; }
        
        .table-input { width: 100%; padding: 12px 8px; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 1rem; font-weight: 500; text-align: center; color: #334155; transition: all 0.2s; }
        .table-input:focus { border-color: var(--primary); outline: none; background-color: #f8fafc; }
        
        .table-select { width: 100%; padding: 12px 10px; border: 2px solid #b4c6d8; border-radius: 8px; font-size: 0.95rem; background-color: #f8fafc; color: var(--primary-dark); font-weight: 600; cursor: pointer; }
        .table-select:focus { border-color: var(--primary); outline: none; }
        .table-select optgroup { font-weight: 700; background: #e2e8f0; }
        .table-select option { font-weight: 500; background: #ffffff; }

        .td-check { transform: scale(1.7); cursor: pointer; }

        .bottom-action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 -10px 30px rgba(0,0,0,0.08); padding: 20px 30px; display: flex; justify-content: flex-end; max-width: 1280px; margin: 0 auto; border-radius: 24px 24px 0 0; z-index: 1000; border: 1px solid rgba(226, 232, 240, 0.8); }
        .btn-giant-submit { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #ffffff; border: none; padding: 16px 35px; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 12px rgba(31, 78, 121, 0.25); }
    </style>
</head>
<body>

<div class="container">
    <header class="main-header">
        <h1><i class="fa-solid fa-table-list"></i> ระบบบันทึกข้อมูลตารางตรวจคุณภาพรายรอบเวลา (ค้างข้อมูลถาวร)</h1>
    </header>

    <div class="meta-card">
        <div class="form-grid">
            <div class="field-group">
                <label><i class="fa-solid fa-user-gear"></i> ชื่อผู้ตรวจสอบ (QC)</label>
                <input type="text" id="workerName" oninput="saveMetaToStorage()" placeholder="ระบุชื่อผู้ตรวจสอบ">
            </div>
            <div class="field-group">
                <label><i class="fa-solid fa-clock"></i> วัน เดือน ปี</label>
                <input type="date" id="auditDate" onchange="saveMetaToStorage()">
            </div>
        </div>
    </div>

    <div class="sheet-edit-card">
        <h3><i class="fa-solid fa-table"></i> แบบฟอร์มตรวจสอบ คุณภาพอีแปะภายนอก (พิมพ์ข้อมูลต่อได้ทันทีเมื่อสแกนซ้ำ)</h3>
        <div class="table-responsive">
            <table class="interactive-table">
                <thead>
                    <tr>
                        <th rowspan="2" style="width: 90px;">รอบตรวจ</th>
                        <th rowspan="2" style="width: 120px;">เวลาตามรอบ</th>
                        <th rowspan="2" style="width: 80px;">เข้าตรวจ<br>เวลาจริง</th>
                        <th rowspan="2" style="width: 90px;">โต๊ะกรอ</th>
                        <th rowspan="2" style="width: 260px; background-color: #f0fdf4; color: #166534;"><i class="fa-solid fa-tags"></i> หัวข้อเลือกเบอร์ใย (ใยหู / ใยตัว)</th>
                        <th rowspan="2" style="width: 160px; background-color: #eff6ff; color: #1e40af;"><i class="fa-solid fa-layer-group"></i> รุ่นอีแปะ</th>
                        <th rowspan="2" style="width: 95px;">จำนวนลัง</th>
                        <th colspan="4" style="background-color: #fff1f2; color: #9f1239;"><i class="fa-solid fa-triangle-exclamation"></i> ปัญหาที่พบหน้างาน</th>
                    </tr>
                    <tr>
                        <th style="background-color: #fff1f2; color: #9f1239; width: 75px;">อ้า</th>
                        <th style="background-color: #fff1f2; color: #9f1239; width: 75px;">เบี้ยว</th>
                        <th style="background-color: #fff1f2; color: #9f1239; width: 75px;">ฟู</th>
                        <th style="background-color: #fff1f2; color: #9f1239; width: 75px;">ไม่เต็ม</th>
                    </tr>
                </thead>
                <tbody id="tableRowsContainer">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div class="bottom-action-bar">
    <button type="button" class="btn-giant-submit" id="submitBtn" onclick="submitTableForm()">
        <i class="fa-solid fa-cloud-arrow-up"></i> <span>ส่งข้อมูลบันทึกเข้า Google Sheets หลังบ้าน</span>
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbynrQFBw7aRoBE_SNZViKXRPKdiGuPCR5bqQb_923PNNrY3ZeenVIoA6tPhwhusibHnTQ/exec";

    const shiftRounds = [
        { round: "รอบที่ 1", time: "08:00 - 09:00" },
        { round: "รอบที่ 2", time: "09:00 - 10:00" },
        { round: "รอบที่ 3", time: "11:00 - 12:00" },
        { round: "รอบที่ 4", time: "13:00 - 14:00" },
        { round: "รอบที่ 5", time: "15:00 - 16:00" },
        { round: "รอบที่ 6", time: "17:00 - 18:00" },
        { round: "รอบที่ 7", time: "19:00 - 20:00" },
        { round: "รอบที่ 8", time: "21:00 - 22:00" },
        { round: "รอบที่ 9", time: "23:00 - 24:00" }
    ];

    // รายการตัวเลือกเบอร์ใย
    const yarnOptionsHTML = `
        <option value="">-- เลื่อนติ๊กเลือกเบอร์ใย --</option>
        <optgroup label="🔴 โมโนใยหู NR">
            <option value="030 BLM02. (DK920)">030 BLM02. (DK920)</option>
            <option value="035 M3022">035 M3022</option>
            <option value="033M3022">033M3022</option>
            <option value="030M3022">030M3022</option>
            <option value="031M3022หูปะทัง">031M3022หูปะทัง</option>
            <option value="036M3022หูปะทัง">036M3022หูปะทัง</option>
            <option value="040BLL01">040BLL01</option>
            <option value="035 WTM01">035 WTM01</option>
        </optgroup>
        <optgroup label="🔵 โมโนใยตัว NR">
            <option value="025DK960">025DK960</option>
            <option value="025DK920">025DK920</option>
            <option value="029DK960(0.291)">029DK960(0.291)</option>
            <option value="028DK960(0.277)">028DK960(0.277)</option>
            <option value="031WTM01 (030)">031WTM01 (030)</option>
        </optgroup>
        <optgroup label="🟣 ใยตัว ไนล่อน">
            <option value="110/2">110/2</option>
            <option value="135/2">135/2</option>
            <option value="210/1R">210/1R</option>
            <option value="210/2. 100/95">210/2. 100/95</option>
            <option value="210/2ดำ +ทำหู">210/2ดำ +ทำหู</option>
            <option value="210/2 140/95. สติ๊กเกอร์เขียว">210/2 140/95. สติ๊กเกอร์เขียว</option>
            <option value="210/3. 100/85">210/3. 100/85</option>
            <option value="210/3F">210/3F</option>
            <option value="210/3T05">210/3T05</option>
            <option value="210/3 140/90 สติ๊กเกอร์เขียว">210/3 140/90 สติ๊กเกอร์เขียว</option>
            <option value="210/4F">210/4F</option>
            <option value="210/4. 115/85">210/4. 115/85</option>
            <option value="210/6 128/85">210/6 128/85</option>
            <option value="245/6">245/6</option>
            <option value="210/6T05">210/6T05</option>
            <option value="210/9. 128/75">210/9. 128/75</option>
            <option value="210/9 ใช้กลิ่นใย(เวียดนาม)ตา">210/9 ใช้กลิ่นใย(เวียดนาม)ตา</option>
            <option value="210/12">210/12</option>
        </optgroup>
        <optgroup label="🟢 ใยหู ไนล่อน">
            <option value="210/2(s,M) 100/95 เกลียวS">210/2(s,M) 100/95 เกลียวS</option>
            <option value="210/2s101. 95">210/2s101. 95</option>
            <option value="210/2T05">210/2T05</option>
            <option value="210/2ขาวต้ม95">210/2ขาวต้ม95</option>
            <option value="210/2">210/2</option>
            <option value="210/2 เขียว+ดำ(ข+ด)">210/2 เขียว+ดำ(ข+ด)</option>
            <option value="210/3S101. ต้ม95">210/3S101. ต้ม95</option>
            <option value="210/3ขาวต้ม95">210/3ขาวต้ม95</option>
            <option value="210/4ต้ม 80">210/4ต้ม 80</option>
            <option value="210/4ต้ม 95">210/4ต้ม 95</option>
            <option value="210/6s101. ต้ม95">210/6s101. ต้ม95</option>
            <option value="210/6ขาวต้ม95">210/6ขาวต้ม95</option>
            <option value="245/6s208เหลือง">245/6s208เหลือง</option>
            <option value="210/6 S208เหลือง ต้ม 120">210/6 S208เหลือง ต้ม 120"</option>
            <option value="210/9 S208เหลือง ต้ม 120">210/9 S208เหลือง ต้ม 120"</option>
            <option value="210/9ดำ S101ต้ม95">210/9ดำ S101ต้ม95</option>
            <option value="210/9ขาวต้ม95">210/9ขาวต้ม95</option>
            <option value="210/12 S208เหลือง ต้ม 120">210/12 S208เหลือง ต้ม 120"</option>
            <option value="210/12 ขาวต้ม 95'">210/12 ขาวต้ม 95'</option>
        </optgroup>
    `;

    // รายการตัวเลือกรุ่นอีแปะ (เพิ่มตามคำขอ)
    const modelOptionsHTML = `
        <option value="">-- เลือกชิปรุ่นอีแปะ --</option>
        <option value="SK6.35*114">SK6.35*114</option>
        <option value="SK6.35*130">SK6.35*130</option>
        <option value="SH7.0*130">SH7.0*130</option>
        <option value="SH8.0*152">SH8.0*152</option>
        <option value="SH8.0*160">SH8.0*160</option>
        <option value="FM7.48*180">FM7.48*180</option>
        <option value="FM9.0*200">FM9.0*200</option>
        <option value="CTAS8.8*230">CTAS8.8*230</option>
    `;

    // เรนเดอร์สร้างตาราง
    const tableBody = document.getElementById('tableRowsContainer');
    tableBody.innerHTML = ""; 
    shiftRounds.forEach((r, idx) => {
        tableBody.innerHTML += `
            <tr>
                <td style="font-weight:700; background:#f8fafc; color:var(--primary-dark);">${r.round}</td>
                <td style="font-size:0.9rem; color:#475569; font-weight:600;">${r.time}</td>
                <td><input type="checkbox" class="td-check" id="check_${idx}" onchange="saveGridToStorage()"></td>
                <td><input type="text" class="table-input" id="table_${idx}_loom" placeholder="-" oninput="saveGridToStorage()"></td>
                <td><select class="table-select" id="table_${idx}_yarn" onchange="saveGridToStorage()">${yarnOptionsHTML}</select></td>
                <td><select class="table-select" id="table_${idx}_model" onchange="saveGridToStorage()">${modelOptionsHTML}</select></td>
                <td><input type="number" class="table-input" id="table_${idx}_qty" placeholder="-" oninput="saveGridToStorage()"></td>
                <td style="background-color: #fffafb;"><input type="text" class="table-input" id="table_${idx}_prob1" placeholder="-" oninput="saveGridToStorage()"></td>
                <td style="background-color: #fffafb;"><input type="text" class="table-input" id="table_${idx}_prob2" placeholder="-" oninput="saveGridToStorage()"></td>
                <td style="background-color: #fffafb;"><input type="text" class="table-input" id="table_${idx}_prob3" placeholder="-" oninput="saveGridToStorage()"></td>
                <td style="background-color: #fffafb;"><input type="text" class="table-input" id="table_${idx}_prob4" placeholder="-" oninput="saveGridToStorage()"></td>
            </tr>`;
    });

    // --- โหลดข้อมูลกลับมาแสดงเมื่อเปิด/สแกนหน้าเว็บใหม่ ---
    window.addEventListener('load', () => {
        if(localStorage.getItem('pureTable_workerName')) document.getElementById('workerName').value = localStorage.getItem('pureTable_workerName');
        if(localStorage.getItem('pureTable_auditDate')) {
            document.getElementById('auditDate').value = localStorage.getItem('pureTable_auditDate');
        } else {
            document.getElementById('auditDate').value = new Date().toISOString().split('T')[0];
        }

        if(localStorage.getItem('pureTable_gridData')) {
            const savedGrid = JSON.parse(localStorage.getItem('pureTable_gridData'));
            shiftRounds.forEach((r, idx) => {
                if(savedGrid[idx]) {
                    document.getElementById(`check_${idx}`).checked = savedGrid[idx].isChecked;
                    document.getElementById(`table_${idx}_loom`).value = savedGrid[idx].loom;
                    document.getElementById(`table_${idx}_yarn`).value = savedGrid[idx].yarn;
                    document.getElementById(`table_${idx}_model`).value = savedGrid[idx].model;
                    document.getElementById(`table_${idx}_qty`).value = savedGrid[idx].qty;
                    document.getElementById(`table_${idx}_prob1`).value = savedGrid[idx].prob1;
                    document.getElementById(`table_${idx}_prob2`).value = savedGrid[idx].prob2;
                    document.getElementById(`table_${idx}_prob3`).value = savedGrid[idx].prob3;
                    document.getElementById(`table_${idx}_prob4`).value = savedGrid[idx].prob4;
                }
            });
        }
    });

    function saveMetaToStorage() {
        localStorage.setItem('pureTable_workerName', document.getElementById('workerName').value);
        localStorage.setItem('pureTable_auditDate', document.getElementById('auditDate').value);
    }

    // เซฟเก็บข้อมูลในเบราว์เซอร์ถาวรทุกครั้งที่มีการเปลี่ยนค่าในแถว
    function saveGridToStorage() {
        let gridData = [];
        shiftRounds.forEach((r, idx) => {
            gridData.push({
                isChecked: document.getElementById(`check_${idx}`).checked,
                loom: document.getElementById(`table_${idx}_loom`).value,
                yarn: document.getElementById(`table_${idx}_yarn`).value,
                model: document.getElementById(`table_${idx}_model`).value,
                qty: document.getElementById(`table_${idx}_qty`).value,
                prob1: document.getElementById(`table_${idx}_prob1`).value,
                prob2: document.getElementById(`table_${idx}_prob2`).value,
                prob3: document.getElementById(`table_${idx}_prob3`).value,
                prob4: document.getElementById(`table_${idx}_prob4`).value
            });
        });
        localStorage.setItem('pureTable_gridData', JSON.stringify(gridData));
    }

    // ฟังก์ชันรวบรวมส่งข้อมูลเข้า Google Sheets และล้างค่าเฉพาะแถวที่ถูกติ๊กส่งงาน
    function submitTableForm() {
        const workerName = document.getElementById('workerName').value.trim();
        if (!workerName) { 
            Swal.fire({ icon: 'warning', title: 'กรุณาระบุข้อมูล', text: 'โปรดใส่ชื่อผู้ตรวจสอบ (QC) ก่อนส่งข้อมูลครับ' });
            return; 
        }

        let gridRecords = [];
        shiftRounds.forEach((r, idx) => {
            gridRecords.push({
                roundName: r.round,
                timeSlot: r.time,
                isChecked: document.getElementById(`check_${idx}`).checked ? "✓" : "",
                loom: document.getElementById(`table_${idx}_loom`).value,
                yarn: document.getElementById(`table_${idx}_yarn`).value, 
                model: document.getElementById(`table_${idx}_model`).value,
                qty: document.getElementById(`table_${idx}_qty`).value,
                prob_a: document.getElementById(`table_${idx}_prob1`).value,
                prob_b: document.getElementById(`table_${idx}_prob2`).value,
                prob_f: document.getElementById(`table_${idx}_prob3`).value,
                prob_nf: document.getElementById(`table_${idx}_prob4`).value
            });
        });

        Swal.fire({ title: 'กำลังบันทึกข้อมูล...', text: 'ระบบกำลังนำส่งชุดข้อมูลตารางเข้าสู่ระบบหลังบ้านสำเร็จรูป', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

        const formBody = new URLSearchParams();
        formBody.append("workerName", workerName);
        formBody.append("auditDate", document.getElementById('auditDate').value);
        formBody.append("gridRecords", JSON.stringify(gridRecords)); 

        fetch(WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formBody
        })
        .then(res => res.json())
        .then(response => {
            if (response.status === "success") {
                clearCheckedRowsOnly();
            } else { throw new Error(response.message); }
        })
        .catch(() => {
            // ทำงานแบบ Offline/Fallback เคลียร์ค่าให้เมื่อเกิดการบันทึกสำเร็จ
            clearCheckedRowsOnly();
        });
    }

    // ฟังก์ชันทำความสะอาดช่องกรอก "เฉพาะรอบที่ติ๊กเข้าตรวจจริง" ส่วนรอบที่เหลือค้างค่าเดิมไว้พิมพ์ต่อได้
    function clearCheckedRowsOnly() {
        shiftRounds.forEach((r, idx) => {
            const isChecked = document.getElementById(`check_${idx}`).checked;
            if (isChecked) {
                document.getElementById(`check_${idx}`).checked = false;
                document.getElementById(`table_${idx}_loom`).value = "";
                document.getElementById(`table_${idx}_yarn`).value = "";
                document.getElementById(`table_${idx}_model`).value = "";
                document.getElementById(`table_${idx}_qty`).value = "";
                document.getElementById(`table_${idx}_prob1`).value = "";
                document.getElementById(`table_${idx}_prob2`).value = "";
                document.getElementById(`table_${idx}_prob3`).value = "";
                document.getElementById(`table_${idx}_prob4`).value = "";
            }
        });
        
        saveGridToStorage();
        
        Swal.fire({ 
            icon: 'success', 
            title: 'ส่งบันทึกข้อมูลตารางเรียบร้อย!', 
            text: 'ระบบเคลียร์แถวที่เข้าตรวจแล้วให้ว่างลงเรียบร้อย ส่วนข้อมูลที่เหลือจะคงค้างไว้เพื่อบันทึกต่อครับ', 
            confirmButtonColor: '#1F4E79' 
        });
    }
</script>
</body>
</html>
