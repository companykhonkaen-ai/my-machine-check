<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมจัดการแผนกทอ E (สมบูรณ์)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #020617; color: #e2e8f0; }
        .cyber-panel { background: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        <h1 class="text-xl font-bold text-white mb-6 border-l-4 border-sky-500 pl-3">โปรแกรมบริหารจัดการ แผนกทอ E</h1>

        <div class="cyber-panel p-6 rounded-2xl">
            <h2 class="text-lg font-bold text-sky-400 mb-4"><i class="fa-solid fa-user-check mr-2"></i> แผงเช็คชื่อและสลับสถานะ</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-slate-400 uppercase text-xs border-b border-slate-700">
                        <tr><th class="p-3">พนักงาน (17 ท่าน)</th><th class="p-3">สถานะ</th><th class="p-3">OT</th></tr>
                    </thead>
                    <tbody id="attendance-table"></tbody>
                </table>
            </div>
        </div>

        <div class="cyber-panel p-6 rounded-2xl">
            <h2 class="text-lg font-bold text-emerald-400 mb-4"><i class="fa-solid fa-calculator mr-2"></i> บันทึกข้อมูลและประสิทธิภาพรายวัน</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div id="emp-list" class="space-y-2 h-[400px] overflow-y-auto pr-2"></div>
                <div id="data-form" class="hidden p-5 bg-slate-900 rounded-xl border border-slate-700">
                    <h3 id="form-title" class="font-bold text-white mb-4 border-b border-slate-700 pb-2"></h3>
                    <div class="space-y-4 text-sm">
                        <input type="text" id="in-table" placeholder="โต๊ะที่ทำงาน" class="w-full p-2.5 bg-slate-800 rounded border border-slate-600 focus:border-emerald-500 outline-none">
                        <input type="text" id="in-yarn" placeholder="เบอร์ใยที่กรอ" class="w-full p-2.5 bg-slate-800 rounded border border-slate-600 focus:border-emerald-500 outline-none">
                        <input type="number" id="in-sheets" placeholder="จำนวนแผ่นอีแปะที่ได้" class="w-full p-2.5 bg-slate-800 rounded border border-slate-600 focus:border-emerald-500 outline-none">
                        <input type="number" id="in-boxes" placeholder="จำนวนลังที่ได้" class="w-full p-2.5 bg-slate-800 rounded border border-slate-600 focus:border-emerald-500 outline-none">
                        <input type="number" id="in-trucks" placeholder="จำนวนรถอีแปะที่ได้" class="w-full p-2.5 bg-slate-800 rounded border border-slate-600 focus:border-emerald-500 outline-none">
                        <button onclick="saveData()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold transition">บันทึกข้อมูลพนักงาน</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let employees = [
            {name: "สมบัติ แสงทอง", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "เยาวมาลย์ พันนา", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "พุทธศรี สามีพันธ์", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "มะลิ ดาวังปา", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "หนูจันทร์ ผิวดี", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "จันทร์เพ็ญ บุตรมา", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "นางบุบผา กุลวงศ์", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "นางศิริพร เสน่ห์จันทร์", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "นางประกอบ ไชยเพ็ง", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "ดาวบด แสนพล", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "ปางทอง คงมังคละ", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "พีราพร ค่อมสิงห์", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "นางประครอง ชัยสมคุณ", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "มลฤดี ปัทเนตร", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "น.ส.ไพรวัน วงษาสืบ", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "นางจันสุดา ถาบุญแก้ว", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "น.ส.กมลรัตน์ พูลทรัพย์", status: "มาทำงาน", ot: false, table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0}
        ];

        let activeIdx = -1;
        const statusOptions = ["มาทำงาน", "มาสาย", "วันหยุด", "ขาดงาน"];

        function render() {
            const table = document.getElementById('attendance-table');
            table.innerHTML = employees.map((e, i) => `
                <tr class="border-b border-slate-700/50">
                    <td class="p-3 font-medium">${e.name}</td>
                    <td class="p-3"><button onclick="cycleStatus(${i})" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs transition">${e.status}</button></td>
                    <td class="p-3"><button onclick="toggleOT(${i})" class="px-3 py-1 ${e.ot ? 'bg-emerald-600' : 'bg-slate-800'} rounded text-xs transition">OT</button></td>
                </tr>
            `).join('');

            const list = document.getElementById('emp-list');
            list.innerHTML = employees.map((e, i) => `
                <button onclick="selectEmp(${i})" class="w-full text-left p-3 bg-slate-800 hover:bg-emerald-900/30 rounded-lg text-sm border border-slate-700 transition">
                    ${e.name}
                </button>
            `).join('');
        }

        function cycleStatus(i) {
            let cur = statusOptions.indexOf(employees[i].status);
            employees[i].status = statusOptions[(cur + 1) % statusOptions.length];
            render();
        }

        function toggleOT(i) { employees[i].ot = !employees[i].ot; render(); }

        function selectEmp(i) {
            activeIdx = i;
            document.getElementById('data-form').classList.remove('hidden');
            document.getElementById('form-title').innerText = "กำลังบันทึก: " + employees[i].name;
            document.getElementById('in-table').value = employees[i].table;
            document.getElementById('in-yarn').value = employees[i].yarn;
            document.getElementById('in-sheets').value = employees[i].sheets;
            document.getElementById('in-boxes').value = employees[i].boxes;
            document.getElementById('in-trucks').value = employees[i].trucks;
        }

        function saveData() {
            employees[activeIdx].table = document.getElementById('in-table').value;
            employees[activeIdx].yarn = document.getElementById('in-yarn').value;
            employees[activeIdx].sheets = document.getElementById('in-sheets').value;
            employees[activeIdx].boxes = document.getElementById('in-boxes').value;
            employees[activeIdx].trucks = document.getElementById('in-trucks').value;
            alert("บันทึกข้อมูล " + employees[activeIdx].name + " เรียบร้อยแล้ว");
            render();
        }

        render();
    </script>
</body>
</html>
