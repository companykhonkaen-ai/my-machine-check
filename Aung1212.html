<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>โปรแกรมแผนกทอ E - ครบวงจร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #020617; color: #e2e8f0; font-family: sans-serif; }
        .panel { background: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-6xl mx-auto space-y-6">
        <div class="flex gap-2">
            <button onclick="showPage('summary')" class="px-4 py-2 bg-sky-600 rounded">หน้าสรุป</button>
            <button onclick="showPage('check')" class="px-4 py-2 bg-slate-700 rounded">เช็คชื่อ</button>
            <button onclick="showPage('input')" class="px-4 py-2 bg-emerald-700 rounded">กรอกประสิทธิภาพ</button>
        </div>

        <div id="page-summary" class="page">
            <h2 class="text-xl font-bold mb-4">รายงานสถานะกำลังพลและประสิทธิภาพประจำวัน</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="panel p-4 rounded">เป้าหมายแผ่น: 1000</div>
                <div class="panel p-4 rounded">เป้าหมายลัง: 100</div>
                <div class="panel p-4 rounded">เป้าหมายรถ: 10</div>
            </div>
        </div>

        <div id="page-check" class="page hidden panel p-4 rounded">
            <h2 class="font-bold mb-4">เช็คชื่อพนักงาน</h2>
            <div id="attendance-list"></div>
        </div>

        <div id="page-input" class="page hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="panel p-4 rounded">
                <h2 class="font-bold mb-2">เลือกพนักงาน</h2>
                <div id="emp-select-list" class="space-y-1"></div>
            </div>
            <div id="data-form" class="hidden panel p-4 rounded border-emerald-500 border-2">
                <h2 id="form-name" class="font-bold text-emerald-400 mb-4"></h2>
                <div class="space-y-3">
                    <input type="text" id="in-table" placeholder="โต๊ะที่ทำงาน" class="w-full p-2 bg-slate-900 border">
                    <input type="text" id="in-yarn" placeholder="เบอร์ใยที่กรอ" class="w-full p-2 bg-slate-900 border">
                    <input type="number" id="in-sheets" placeholder="จำนวนแผ่นอีแปะที่ได้" class="w-full p-2 bg-slate-900 border">
                    <input type="number" id="in-boxes" placeholder="จำนวนลังที่ได้" class="w-full p-2 bg-slate-900 border">
                    <input type="number" id="in-trucks" placeholder="จำนวนรถอีแปะที่ได้" class="w-full p-2 bg-slate-900 border">
                    <button onclick="saveData()" class="w-full py-2 bg-emerald-600 font-bold">บันทึกข้อมูล</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let employees = [
            {name: "สมบัติ แสงทอง", table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            {name: "เยาวมาลย์ พันนา", table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0},
            /* ... เพิ่มให้ครบ 17 คน ... */
        ];
        let activeIdx = -1;

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + id).classList.remove('hidden');
        }

        function selectEmp(i) {
            activeIdx = i;
            document.getElementById('data-form').classList.remove('hidden');
            document.getElementById('form-name').innerText = employees[i].name;
            document.getElementById('in-table').value = employees[i].table;
            document.getElementById('in-yarn').value = employees[i].yarn;
            // ... เติมค่าอื่นๆ
        }

        function saveData() {
            employees[activeIdx].table = document.getElementById('in-table').value;
            employees[activeIdx].yarn = document.getElementById('in-yarn').value;
            // ... บันทึกค่า
            alert("บันทึกแล้ว");
        }

        // โหลดรายชื่อตอนเริ่ม
        document.getElementById('emp-select-list').innerHTML = employees.map((e, i) => 
            `<button onclick="selectEmp(${i})" class="block w-full p-2 bg-slate-800 text-left">${e.name}</button>`
        ).join('');
    </script>
</body>
</html>
