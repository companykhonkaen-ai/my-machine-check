<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการกำลังพล กรออีแปะ v5.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background: linear-gradient(to bottom, #030712, #0a0f1c); }
        .cyber-panel { background: rgba(15,23,42,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .form-input { background: rgba(15,23,42,0.9); border: 1px solid rgba(148,163,184,0.3); }
        .nav-tab.active { background: linear-gradient(to right, #0ea5e9, #3b82f6); color: white; }
        .status-btn { transition: all 0.2s; }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-6">

<div class="max-w-7xl mx-auto">

    <!-- LOGIN (เหมือนเดิม) -->
    <div id="login-modal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50 hidden">
        <div class="cyber-panel rounded-3xl p-10 w-full max-w-md">
            <h1 class="text-3xl font-bold mb-8 text-center">เข้าสู่ระบบ</h1>
            <input id="username" placeholder="Username" class="form-input w-full p-4 rounded-2xl mb-4">
            <input id="password" type="password" placeholder="Password" class="form-input w-full p-4 rounded-2xl mb-6">
            <button onclick="login()" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-2xl font-bold">เข้าสู่ระบบ</button>
            <p class="text-center text-xs mt-6 text-slate-400">
                supervisor / 1234<br>manager / 1234<br>accountant / 1234
            </p>
        </div>
    </div>

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-black text-white">กรออีแปะ Production v5.3</h1>
        <div class="flex items-center gap-4">
            <span id="user-info" class="font-medium"></span>
            <button onclick="logout()" class="px-6 py-3 bg-red-900/60 hover:bg-red-800 rounded-2xl">ออกจากระบบ</button>
        </div>
    </div>

    <!-- NAV -->
    <div id="nav-tabs" class="flex gap-3 mb-10"></div>

    <!-- DASHBOARD -->
    <div id="page-dashboard" class="page-content">
        <h2 class="text-2xl font-bold mb-6">แดชบอร์ดภาพรวมวันนี้</h2>
        <div id="dashboard-summary" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </div>

    <!-- ATTENDANCE PAGE (ตารางเช็คชื่อ) -->
    <div id="page-attendance" class="page-content hidden">
        <div class="cyber-panel rounded-3xl p-8">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                <i class="fa-solid fa-user-check"></i> เช็คชื่อการมาทำงาน
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-slate-900">
                        <tr>
                            <th class="p-4 text-left">ชื่อ-นามสกุล</th>
                            <th class="p-4 text-center">สถานะ</th>
                            <th class="p-4 text-center">โต๊ะกรอ</th>
                            <th class="p-4 text-center">เบอร์ใย</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-table" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- PERFORMANCE PAGE -->
    <div id="page-performance" class="page-content hidden">
        <!-- เนื้อหา Performance (เหมือนเวอร์ชันก่อนหน้า) -->
        <div class="cyber-panel rounded-3xl p-8">
            <h2 class="text-2xl font-bold mb-6">ลงข้อมูลประสิทธิภาพการทำงาน</h2>
            <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">
                <div class="xl:col-span-4" id="emp-list"></div>
                <div class="xl:col-span-8" id="perf-form"></div>
            </div>
        </div>
    </div>

</div>

<script>
// ================== ข้อมูลหลัก ==================
let currentUser = null;
let currentDate = new Date().toISOString().split('T')[0];
let archiveDatabase = {};

const baseEmployees = [
    { id: "1", name: "สมบัติ แสทอง", phone: "081-765-4321", attendance: "✓", table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0, comment: "", score: 0 },
    // เพิ่มคนอื่น ๆ ตามเดิม (ย่อไว้)
];

for(let i = 2; i <= 17; i++) {
    baseEmployees.push({ id: String(i), name: `พนักงาน ${i}`, phone: "08x-xxx-xxxx", attendance: "✓", table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0, comment: "", score: 0 });
}

const users = {
    supervisor: { pass: "1234", name: "หัวหน้ากลุ่ม" },
    manager: { pass: "1234", name: "ผู้จัดการ" },
    accountant: { pass: "1234", name: "บัญชี" }
};

// ================== LOGIN ==================
function login() {
    const username = document.getElementById('username').value.toLowerCase();
    const password = document.getElementById('password').value;
    if (users[username] && users[username].pass === password) {
        currentUser = { username, ...users[username] };
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('user-info').innerText = currentUser.name;
        initSystem();
    } else {
        alert("รหัสผ่านไม่ถูกต้อง");
    }
}

function logout() { location.reload(); }

function initSystem() {
    if (!archiveDatabase[currentDate]) archiveDatabase[currentDate] = JSON.parse(JSON.stringify(baseEmployees));
    renderNav();
    switchPage('dashboard');
}

function renderNav() {
    let html = `
        <button onclick="switchPage('dashboard')" class="nav-tab px-6 py-3 rounded-2xl">แดชบอร์ด</button>
        <button onclick="switchPage('attendance')" class="nav-tab px-6 py-3 rounded-2xl">เช็คชื่อ</button>
        <button onclick="switchPage('performance')" class="nav-tab px-6 py-3 rounded-2xl">ประสิทธิภาพ</button>
    `;
    document.getElementById('nav-tabs').innerHTML = html;
}

function switchPage(page) {
    document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
    document.getElementById(`page-${page}`).classList.remove('hidden');
    
    if (page === 'dashboard') renderDashboard();
    if (page === 'attendance') renderAttendanceTable();
    if (page === 'performance') renderPerformanceList();
}

// ================== เช็คชื่อ (สำคัญ) ==================
function renderAttendanceTable() {
    const tbody = document.getElementById('attendance-table');
    tbody.innerHTML = '';
    
    archiveDatabase[currentDate].forEach(emp => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/50';
        tr.innerHTML = `
            <td class="p-4 font-medium">${emp.name}</td>
            <td class="p-4 text-center">
                <select onchange="changeAttendance('${emp.id}', this.value)" class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-1 text-center">
                    <option value="✓" ${emp.attendance === '✓' ? 'selected' : ''}>✅ มาทำงาน</option>
                    <option value="สาย" ${emp.attendance === 'สาย' ? 'selected' : ''}>🟡 มาสาย</option>
                    <option value="❌" ${emp.attendance === '❌' ? 'selected' : ''}>🔴 ขาดงาน</option>
                    <option value="H" ${emp.attendance === 'H' ? 'selected' : ''}>🟣 วันหยุด</option>
                </select>
            </td>
            <td class="p-4"><input type="text" value="${emp.table}" onchange="updateEmpField('${emp.id}', 'table', this.value)" class="form-input w-full text-sm"></td>
            <td class="p-4"><input type="text" value="${emp.yarn}" onchange="updateEmpField('${emp.id}', 'yarn', this.value)" class="form-input w-full text-sm"></td>
        `;
        tbody.appendChild(tr);
    });
}

function changeAttendance(id, status) {
    const emp = archiveDatabase[currentDate].find(e => e.id === id);
    if (emp) emp.attendance = status;
    renderDashboard(); // อัปเดตแดชบอร์ด
}

function updateEmpField(id, field, value) {
    const emp = archiveDatabase[currentDate].find(e => e.id === id);
    if (emp) emp[field] = value;
}

// ================== แดชบอร์ด ==================
function renderDashboard() {
    let present = 0, late = 0, absent = 0;
    archiveDatabase[currentDate].forEach(emp => {
        if (emp.attendance === '✓') present++;
        else if (emp.attendance === 'สาย') late++;
        else if (emp.attendance === '❌') absent++;
    });

    document.getElementById('dashboard-summary').innerHTML = `
        <div class="cyber-panel p-6 rounded-3xl text-center">
            <div class="text-emerald-400 text-4xl font-bold">${present}</div>
            <div class="text-slate-400">มาทำงานปกติ</div>
        </div>
        <div class="cyber-panel p-6 rounded-3xl text-center">
            <div class="text-amber-400 text-4xl font-bold">${late}</div>
            <div class="text-slate-400">มาสาย</div>
        </div>
        <div class="cyber-panel p-6 rounded-3xl text-center">
            <div class="text-red-400 text-4xl font-bold">${absent}</div>
            <div class="text-slate-400">ขาดงาน</div>
        </div>
        <div class="cyber-panel p-6 rounded-3xl text-center">
            <div class="text-white text-4xl font-bold">${archiveDatabase[currentDate].length}</div>
            <div class="text-slate-400">ทั้งหมด</div>
        </div>
    `;
}

// ================== Performance (ย่อ) ==================
function renderPerformanceList() {
    // ... (โค้ดเดิมที่สวย) ...
    document.getElementById('emp-list').innerHTML = '<p class="text-center py-12 text-slate-400">เลือกรายชื่อพนักงานเพื่อกรอกประสิทธิภาพ</p>';
}

// Start
window.onload = () => {
    document.getElementById('login-modal').classList.remove('hidden');
};
</script>
</body>
</html>
