<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPAE AI Command Center V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background-color: #060913;
            background-image: 
                linear-gradient(rgba(14, 165, 233, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .cyber-panel {
            background: rgba(10, 15, 30, 0.75);
            border: 1px solid rgba(14, 165, 233, 0.2);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.05);
            backdrop-filter: blur(12px);
        }
        .pulse-glow-green { animation: p-green 2s infinite; }
        @keyframes p-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- HEADER: AI OPERATIONAL HUB -->
        <header class="cyber-panel rounded-2xl p-6 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-t-4 border-t-sky-500">
            <div>
                <div class="flex items-center gap-3">
                    <div class="w-3.5 h-3.5 rounded-full bg-emerald-500 pulse-glow-green"></div>
                    <h1 class="text-2xl font-black text-white tracking-wide font-mono-tech">EPAE MATRIX AI CORE</h1>
                </div>
                <p class="text-xs text-slate-400 mt-1">ระบบวิเคราะห์กำลังพลและพฤติกรรมสมาชิกอัตโนมัติด้วย AI & Voice Command</p>
            </div>

            <!-- TECH CONTROL BUTTONS -->
            <div class="flex flex-wrap gap-2">
                <!-- ปุ่มระบบสั่งการด้วยเสียง -->
                <button onclick="startVoiceRecognition()" id="btn-voice" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 border border-sky-500/40 text-sky-400 rounded-xl text-xs font-bold flex items-center gap-2 transition">
                    <i class="fa-solid fa-microphone animate-bounce"></i> <span id="voice-status">เปิดระบบสั่งเสียง (Voice AI)</span>
                </button>

                <!-- ปุ่มจำลองการส่งออโต้เข้า LINE -->
                <button onclick="simulateLineNotify()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg shadow-emerald-600/20 transition">
                    <i class="fa-brands fa-line text-sm"></i> ทดสอบยิงรายงานเข้ากลุ่ม LINE (Automation)
                </button>
            </div>
        </header>

        <!-- DASHBOARD SPLIT GRID -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">
            
            <!-- LEFT: CONTROLLER & ANALYSIS -->
            <div class="xl:col-span-4 space-y-6">
                <!-- AI Live Analytics (กราฟวิเคราะห์พฤติกรรมรวม) -->
                <div class="cyber-panel rounded-2xl p-4">
                    <h2 class="text-xs font-black uppercase text-sky-400 tracking-wider mb-3"><i class="fa-solid fa-chart-pie"></i> AI Behavior Analytics (ภาพรวมเดือนนี้)</h2>
                    <div class="h-44 flex items-center justify-center">
                        <canvas id="behaviorChart"></canvas>
                    </div>
                </div>

                <!-- รายชื่อพนักงานซ้ายมือสไตล์ไฮเทค -->
                <div class="cyber-panel rounded-2xl p-4">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-xs font-black uppercase text-slate-400 tracking-wider"><i class="fa-solid fa-address-book"></i> รายชื่อสมาชิก (17 คน)</h2>
                        <span class="text-[10px] font-mono bg-sky-500/10 text-sky-400 px-2 py-0.5 rounded border border-sky-500/20">Voice Active</span>
                    </div>
                    <div class="space-y-2 max-h-96 overflow-y-auto pr-1" id="voice-emp-list">
                        <!-- บรรจุข้อมูลผ่าน JS -->
                    </div>
                </div>
            </div>

            <!-- RIGHT: PREVIEW REPORT SCREEN -->
            <div class="xl:col-span-8 space-y-4">
                <div class="cyber-panel rounded-3xl p-6 border border-slate-800" id="main-presentation-core">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                        <div>
                            <h3 class="text-lg font-black text-white">แผงพยากรณ์และรายงานสถานะกำลังพล</h3>
                            <p class="text-[11px] text-slate-500">ข้อมูลอัปเดตแบบเรียลไทม์ ซิงค์ผ่านคลาวด์เซิร์ฟเวอร์</p>
                        </div>
                        <span class="text-xs font-mono font-bold px-3 py-1 bg-slate-900 border border-slate-700 rounded-lg text-amber-400">12 มิถุนายน 2026</span>
                    </div>

                    <!-- การ์ดจำลองพนักงานแบบล้ำสมัย -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="grid-cards-view">
                        <!-- การ์ดไฮเทคจะโชว์ตรงนี้ -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const employees = [
            { id: 1, name: "สมบัติ แสงทอง", status: "🟢 กะเช้า", risk: "ต่ำ", attendance: 98 },
            { id: 2, name: "เยาวมาลย์ พันนา", status: "🔴 ขาดงาน", risk: "สูง (ขาดบ่อย)", attendance: 74 },
            { id: 3, name: "พุทธศรี สามีพันธ์", status: "🔵 กะดึก", risk: "ต่ำ", attendance: 100 },
            { id: 4, name: "มะลิ ดาวังปา", status: "🟡 มาสาย", risk: "ปานกลาง", attendance: 88 }
        ];

        function renderComponents() {
            // วาดรายชื่อพนักงานฝั่งซ้าย
            const leftBox = document.getElementById('voice-emp-list');
            leftBox.innerHTML = '';
            employees.forEach(e => {
                leftBox.innerHTML += `
                    <div class="p-2.5 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                        <div>
                            <div class="font-bold text-white">${e.name}</div>
                            <div class="text-[10px] text-slate-500">อัตราเข้างาน: ${e.attendance}%</div>
                        </div>
                        <span class="text-[10px] font-black">${e.status}</span>
                    </div>
                `;
            });

            // วาดการ์ดสรุปพฤติกรรมฝั่งขวา
            const rightGrid = document.getElementById('grid-cards-view');
            rightGrid.innerHTML = '';
            employees.forEach(e => {
                let riskColor = e.risk.includes('สูง') ? 'text-rose-400 bg-rose-500/10 border-rose-500/30' : 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20';
                rightGrid.innerHTML += `
                    <div class="bg-slate-950/80 p-4 rounded-2xl border border-slate-800 flex flex-col justify-between gap-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-black text-white text-sm">${e.name}</h4>
                                <p class="text-[10px] text-slate-400 mt-0.5">ID: EPAE-00${e.id}</p>
                            </div>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${riskColor}">AI ประเมินความเสี่ยง: ${e.risk}</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-1.5">
                            <div class="bg-sky-500 h-1.5 rounded-full" style="width: ${e.attendance}%"></div>
                        </div>
                        <div class="flex justify-between items-center text-[11px] pt-1 border-t border-slate-900">
                            <span class="text-slate-500">สถานะกะทำงาน:</span>
                            <span class="font-extrabold text-white">${e.status}</span>
                        </div>
                    </div>
                `;
            });
        }

        // 🎙️ เทคโนโลยี 1: ระบบสั่งการด้วยเสียง Web Speech API (รองรับภาษาไทย)
        function startVoiceRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                alert("เบราว์เซอร์ของคุณไม่รองรับระบบ Speech Recognition แนะนำให้ใช้ Google Chrome ครับ");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.interimResults = false;

            document.getElementById('voice-status').innerText = "🔊 กำลังฟังเสียงของคุณ...";
            recognition.start();

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('voice-status').innerText = `เข้าใจว่า: "${speechToText}"`;
                
                // ตรรกะตรวจจับคำสั่งเสียงอัจฉริยะ
                if (speechToText.includes('สมบัติ') && speechToText.includes('ขาด')) {
                    employees[0].status = "🔴 ขาดงาน";
                    employees[0].attendance -= 5;
                } else if (speechToText.includes('สมบัติ') && speechToText.includes('มา')) {
                    employees[0].status = "🟢 กะเช้า";
                } else if (speechToText.includes('เยาวมาลย์') && speechToText.includes('มา')) {
                    employees[1].status = "🟢 กะเช้า";
                    employees[1].attendance = 80;
                    employees[1].risk = "ปานกลาง";
                }
                
                setTimeout(() => {
                    document.getElementById('voice-status').innerText = "เปิดระบบสั่งเสียง (Voice AI)";
                }, 3000);
                
                renderComponents();
            };

            recognition.onerror = function() {
                document.getElementById('voice-status').innerText = "เปิดระบบสั่งเสียง (Voice AI)";
            }
        }

        // 🤖 เทคโนโลยี 2: ระบบจำลองการยิง LINE Automation
        function simulateLineNotify() {
            alert("🚀 [Automation Active] ระบบได้จำลองการส่งข้อมูลสรุปพฤติกรรมสมาชิกรายวันแบบ Flex Message เข้าสู่กลุ่ม LINE เรียบร้อยแล้ว! (ไม่ต้องกดเซฟรูปภาพและพิมพ์ข้อความเอง)");
        }

        // วาดกราฟประกอบสถิติ AI
        window.onload = () => {
            renderComponents();
            const ctx = document.getElementById('behaviorChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['ปกติ', 'เสี่ยง', 'พ้นสภาพ'],
                    datasets: [{
                        data: [14, 2, 1],
                        backgroundColor: ['#10b981', '#f59e0b', '#f43f5e'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } }
                }
            });
        }
    </script>
</body>
</html>
