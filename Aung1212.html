<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการกำลังพลและประสิทธิภาพ กรออีแปะ v5.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background: #030712; }
        .cyber-panel { background: rgba(15,23,42,0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
        .form-input { @apply bg-slate-900 border border-slate-700 rounded-2xl px-5 py-4 text-white focus:border-sky-500 focus:ring-2 focus:ring-sky-500/30 transition-all; }
    </style>
</head>
<body class="text-slate-300 min-h-screen p-6">

<div class="max-w-7xl mx-auto">

    <!-- LOGIN -->
    <div id="login-modal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50">
        <div class="cyber-panel rounded-3xl p-10 w-full max-w-md">
            <h1 class="text-3xl font-bold text-white text-center mb-8">เข้าสู่ระบบ</h1>
            <input id="username" placeholder="ชื่อผู้ใช้" class="form-input w-full mb-4">
            <input id="password" type="password" placeholder="รหัสผ่าน" class="form-input w-full mb-6">
            <button onclick="login()" class="w-full py-4 bg-gradient-to-r from-sky-500 to-indigo-600 rounded-2xl font-bold text-lg">เข้าสู่ระบบ</button>
            <p class="text-center text-xs text-slate-500 mt-6">
                supervisor / 1234<br>
                manager / 1234<br>
                accountant / 1234
            </p>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content" class="hidden">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-black text-white">EPAE PRODUCTION v5.0</h1>
                <p id="current-role" class="text-emerald-400"></p>
            </div>
            <button onclick="logout()" class="px-6 py-3 bg-red-900/50 hover:bg-red-800 rounded-2xl">ออกจากระบบ</button>
        </div>

        <!-- NAV -->
        <div id="nav-tabs" class="flex gap-2 mb-8 flex-wrap"></div>

        <!-- PERFORMANCE PAGE -->
        <div id="page-performance" class="page-content">
            <div class="cyber-panel rounded-3xl p-8">
                <h2 class="text-2xl font-bold mb-6">ลงข้อมูลประสิทธิภาพการทำงาน</h2>
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <div class="lg:col-span-4">
                        <div id="perf-emp-list" class="space-y-2 max-h-[620px] overflow-auto"></div>
                    </div>
                    <div class="lg:col-span-8 cyber-panel rounded-3xl p-8" id="perf-form-box">
                        <!-- Form will be injected by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- APPROVAL PAGE (Manager) -->
        <div id="page-approval" class="page-content hidden">
            <div class="cyber-panel rounded-3xl p-8">
                <h2 class="text-2xl font-bold mb-6">กล่องงานรออนุมัติ</h2>
                <div id="approval-list"></div>
            </div>
        </div>

        <!-- ARCHIVE PAGE (Accountant) -->
        <div id="page-archive" class="page-content hidden">
            <div class="cyber-panel rounded-3xl p-8">
                <h2 class="text-2xl font-bold mb-6">คลังข้อมูลที่อนุมัติแล้ว</h2>
                <button onclick="exportToExcel()" class="mb-6 px-6 py-3 bg-emerald-600 rounded-2xl">ดาวน์โหลด Excel</button>
                <div id="archive-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ================== USERS & DATA ==================
const users = {
    supervisor: { pass: "1234", role: "supervisor", name: "หัวหน้ากลุ่ม" },
    manager: { pass: "1234", role: "manager", name: "ผู้จัดการแผนก" },
    accountant: { pass: "1234", role: "accountant", name: "เจ้าหน้าที่บัญชี" }
};

let currentUser = null;
let currentDate = new Date().toISOString().split('T')[0];
let archiveDatabase = {};

// Base Employees
const baseEmployees = [ /* 17 คนเดิม */ 
    { id: "1", name: "สมบัติ แสทอง", phone: "081-765-4321", table: "", yarn: "", sheets: 0, boxes: 0, trucks: 0, comment: "", status: "draft", score: 0 },
    // ... (เพิ่มคนอื่น ๆ เหมือนเดิม) 
];

// ใส่ข้อมูลพนักงานทั้งหมดที่นี่ (ย่อเพื่อความกระชับ)
for(let i=2; i<=17; i++) baseEmployees.push({ id: String(i), name: "พนักงาน "+i, phone: "08x-xxx-xxxx", table:"", yarn:"", sheets:0, boxes:0, trucks:0, comment:"", status:"draft", score:0 });

// ================== LOGIN ==================
function login() {
    const user = document.getElementById('username').value.toLowerCase();
    const pass = document.getElementById('password').value;
    if (users[user] && users[user].pass === pass) {
        currentUser = { username: user, ...users[user] };
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        document.getElementById('current-role').innerHTML = `${currentUser.name} <span class="text-xs">(${currentUser.role})</span>`;
        initSystem();
    } else alert("รหัสผ่านไม่ถูกต้อง");
}

function logout() { location.reload(); }

// ================== CORE FUNCTIONS ==================
function initSystem() {
    if (!archiveDatabase[currentDate]) archiveDatabase[currentDate] = JSON.parse(JSON.stringify(baseEmployees));
    renderNav();
    switchPage(currentUser.role === 'supervisor' ? 'performance' : currentUser.role === 'manager' ? 'approval' : 'archive');
}

function renderNav() {
    let html = `<button onclick="switchPage('performance')" class="nav-tab px-6 py-3 rounded-2xl font-medium">กรอกประสิทธิภาพ</button>`;
    if (currentUser.role === 'manager') html += `<button onclick="switchPage('approval')" class="nav-tab px-6 py-3 rounded-2xl font-medium">อนุมัติ</button>`;
    if (currentUser.role === 'accountant') html += `<button onclick="switchPage('archive')" class="nav-tab px-6 py-3 rounded-2xl font-medium">คลังข้อมูล</button>`;
    document.getElementById('nav-tabs').innerHTML = html;
}

function switchPage(page) {
    document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
    document.getElementById(`page-${page}`).classList.remove('hidden');
    if (page === 'performance') renderPerformance();
    if (page === 'approval') renderApproval();
    if (page === 'archive') renderArchive();
}

// ================== PERFORMANCE FORM (สวยมาก) ==================
function renderPerformance() {
    let html = '';
    archiveDatabase[currentDate].forEach(emp => {
        html += `
            <div onclick="selectEmployee('${emp.id}')" class="p-4 bg-slate-900/70 hover:bg-slate-800 border border-slate-700 rounded-2xl cursor-pointer">
                <div class="font-semibold">${emp.name}</div>
                <div class="text-xs text-slate-400">แผ่น: ${emp.sheets} | คะแนน: ${emp.score}</div>
            </div>`;
    });
    document.getElementById('perf-emp-list').innerHTML = html;
}

let currentEmpId = null;
function selectEmployee(id) {
    const emp = archiveDatabase[currentDate].find(e => e.id === id);
    currentEmpId = id;
    let formHTML = `
        <div class="space-y-6">
            <div class="flex items-center gap-4 bg-gradient-to-r from-sky-900 to-slate-900 p-6 rounded-3xl">
                <div class="text-4xl">👷</div>
                <div>
                    <div class="text-2xl font-bold">${emp.name}</div>
                    <div class="text-slate-400">${emp.phone}</div>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-6">
                <div><label class="block text-sm mb-2">โต๊ะกรอ</label><input id="table" value="${emp.table}" class="form-input w-full"></div>
                <div><label class="block text-sm mb-2">เบอร์ใย</label><input id="yarn" value="${emp.yarn}" class="form-input w-full"></div>
            </div>
            
            <div class="grid grid-cols-3 gap-6">
                <div><label class="block text-sm mb-2 text-emerald-400">จำนวนแผ่น</label><input id="sheets" type="number" value="${emp.sheets}" oninput="calcScore()" class="form-input w-full text-center text-3xl"></div>
                <div><label class="block text-sm mb-2 text-sky-400">จำนวนลัง</label><input id="boxes" type="number" value="${emp.boxes}" oninput="calcScore()" class="form-input w-full text-center text-3xl"></div>
                <div><label class="block text-sm mb-2 text-amber-400">จำนวนคันรถ</label><input id="trucks" type="number" value="${emp.trucks}" oninput="calcScore()" class="form-input w-full text-center text-3xl"></div>
            </div>
            
            <div>
                <label class="block text-sm mb-2">ความคิดเห็น / หมายเหตุ</label>
                <textarea id="comment" class="form-input w-full h-24">${emp.comment}</textarea>
            </div>
            
            <div class="bg-slate-900 p-4 rounded-2xl">
                <div class="text-lg">คะแนนรวม: <span id="total-score" class="font-mono text-3xl text-emerald-400">${emp.score}</span></div>
            </div>
            
            <div class="flex gap-4">
                <button onclick="savePerformance()" class="flex-1 py-5 bg-sky-600 rounded-2xl font-bold">💾 บันทึกชั่วคราว</button>
                <button onclick="submitToManager()" class="flex-1 py-5 bg-emerald-600 rounded-2xl font-bold">📤 ส่งให้ผู้จัดการ</button>
                <button onclick="clearForm()" class="px-8 py-5 bg-slate-700 rounded-2xl">ล้าง</button>
            </div>
        </div>`;
    document.getElementById('perf-form-box').innerHTML = formHTML;
}

function calcScore() {
    const sheets = parseInt(document.getElementById('sheets').value) || 0;
    const boxes = parseInt(document.getElementById('boxes').value) || 0;
    const trucks = parseInt(document.getElementById('trucks').value) || 0;
    const score = sheets * 1 + boxes * 5 + trucks * 10;
    document.getElementById('total-score').textContent = score;
}

function savePerformance() {
    const emp = archiveDatabase[currentDate].find(e => e.id === currentEmpId);
    if (!emp) return;
    emp.table = document.getElementById('table').value;
    emp.yarn = document.getElementById('yarn').value;
    emp.sheets = parseInt(document.getElementById('sheets').value) || 0;
    emp.boxes = parseInt(document.getElementById('boxes').value) || 0;
    emp.trucks = parseInt(document.getElementById('trucks').value) || 0;
    emp.comment = document.getElementById('comment').value;
    emp.score = parseInt(document.getElementById('total-score').textContent);
    alert("บันทึกสำเร็จ");
}

function submitToManager() {
    if (currentUser.role !== 'supervisor') return alert("เฉพาะหัวหน้ากลุ่มเท่านั้น");
    const emp = archiveDatabase[currentDate].find(e => e.id === currentEmpId);
    emp.status = "pending";
    alert("ส่งให้ผู้จัดการเรียบร้อยแล้ว");
}

// ================== APPROVAL & ARCHIVE (ย่อ) ==================
function renderApproval() { /* Logic อนุมัติ */ document.getElementById('approval-list').innerHTML = "<p class='text-center py-12 text-slate-400'>รายการรออนุมัติ (จำลอง)</p>"; }
function renderArchive() { /* Logic คลังข้อมูล */ document.getElementById('archive-list').innerHTML = "<p class='text-center py-12 text-slate-400'>ข้อมูลที่อนุมัติแล้ว</p>"; }

function exportToExcel() {
    alert("ดาวน์โหลดไฟล์ Excel สำเร็จ (ในระบบจริงจะสร้างไฟล์จริง)");
}

// Init
window.onload = () => {
    document.getElementById('login-modal').classList.remove('hidden');
};
</script>
</body>
</html>
