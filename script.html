<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมแปลใบสั่งทอ PDF อัตโนมัติ (ไทย -> พม่า)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', 'Padauk', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 { color: #1a365d; margin-top: 0; }
        p { color: #555; font-size: 14px; }
        .file-input-wrapper {
            margin: 20px 0;
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            border: 2px dashed #2b6cb0;
            display: inline-block;
            padding: 15px 30px;
            cursor: pointer;
            border-radius: 8px;
            color: #2b6cb0;
            font-weight: bold;
            background: #ebf8ff;
            transition: all 0.3s;
        }
        .custom-file-upload:hover {
            background: #bee3f8;
        }
        button {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #2c5282; }
        button:disabled { background-color: #cbd5e0; cursor: not-allowed; }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #2b6cb0;
        }
        /* ซ่อนส่วนจัดการระบบเวลาสั่งพิมพ์ */
        @media print {
            .container, #status { display: none; }
            #print-area { display: block !important; }
        }
        #print-area { display: none; width: 100%; max-width: 800px; background: white; padding: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚙️ ระบบแปลงใบสั่งทอ E52 เป็นภาษาพม่า</h2>
        <p>วิธีใช้: เลือกไฟล์ PDF ใบสั่งผลิตสินค้า (ขายต่างประเทศ) ของโรงงานคุณ จากนั้นกดปุ่มประมวลผล ระบบจะแปลคำศัพท์และเด้งหน้าต่างพร้อมสั่งพิมพ์ให้ทันที</p>
        
        <div class="file-input-wrapper">
            <label class="custom-file-upload">
                <input type="file" id="pdf-file" accept=".pdf">
                📁 เลือกไฟล์ PDF ใบสั่งทอ
            </label>
            <div id="file-name" style="margin-top: 10px; font-size: 13px; color: #4a5568;">ยังไม่ได้เลือกไฟล์</div>
        </div>

        <button id="process-btn" disabled>🚀 เริ่มประมวลผลและเด้งหน้าต่างสั่งพิมพ์</button>
        <div id="status"></div>
    </div>

    <div id="print-area"></div>

<script>
    // ตั้งค่าตัวอ่านไฟล์ PDF ของ Google
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const fileInput = document.getElementById('pdf-file');
    const fileNameDiv = document.getElementById('file-name');
    const processBtn = document.getElementById('process-btn');
    const statusDiv = document.getElementById('status');
    const printArea = document.getElementById('print-area');

    let pdfData = null;

    fileInput.addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            const file = e.target.files[0];
            fileNameDiv.innerText = "ไฟล์ที่เลือก: " + file.name;
            processBtn.disabled = false;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                pdfData = new Uint8Array(evt.target.result);
            };
            reader.readAsArrayBuffer(file);
        }
    });

    // ระบบเชื่อมต่อ Google Translate เพื่อแปลข้อความสดแสนคำล้านคำ
    async function translateToMyanmar(text) {
        if (!text || text.trim() === "" || !isNaN(text) || text.trim().length < 2) return text;
        
        // ข้ามคำที่เป็นรหัสเฉพาะ ภาษาอังกฤษ หรือสัญลักษณ์โรงงาน
        if (/^[A-Za-z0-9\-\/\s\*\.\:\,]+$/.test(text.trim())) return text;

        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl=my&dt=t&q=${encodeURIComponent(text.trim())}`;
            const response = await fetch(url);
            const data = await response.json();
            if (data && data[0] && data[0][0]) {
                return data[0][0][0]; // คืนค่าคำแปลภาษาพม่า
            }
        } catch (error) {
            console.error("แปลขัดข้อง:", error);
        }
        return text;
    }

    processBtn.addEventListener('click', async function() {
        if (!pdfData) return;
        
        processBtn.disabled = true;
        statusDiv.innerText = "⏳ ระบบกำลังแกะพิกัดตารางและอ่านข้อความ...";
        printArea.innerHTML = ""; // ล้างหน้าจอเก่า

        try {
            const loadingTask = pdfjsLib.getDocument({data: pdfData});
            const pdf = await loadingTask.promise;
            
            // อ่านทีละหน้า (รองรับใบสั่งผลิตที่มีหลายหน้า)
            for (let i = 1; i <= pdf.numPages; i++) {
                statusDiv.innerText = `⏳ กำลังประมวลผลคำศัพท์หน้าคอมพิวเตอร์ หน้าที่ ${i}/${pdf.numPages}...`;
                const page = await pdf.getPage(i);
                
                // ดึงพิกัดตำแหน่งตัวอักษรเดิมมาทั้งหมดเพื่อรักษารูปแบบ 100%
                const textContent = await page.getTextContent();
                const viewport = page.getViewport({scale: 1.3}); // ปรับขนาดให้พอดีหน้ากระดาษพิมพ์
                
                // สร้างหน้ากระดาษจำลองขึ้นมาในเว็บ
                const pageDiv = document.createElement('div');
                pageDiv.style.position = 'relative';
                pageDiv.style.width = viewport.width + 'px';
                pageDiv.style.height = viewport.height + 'px';
                pageDiv.style.background = 'white';
                pageDiv.style.marginBottom = '30px';
                pageDiv.style.pageBreakAfter = 'always';
                
                // วิ่งไล่แปลตัวอักษรทีละบล็อกตามตำแหน่งพิกัดเดิมเป๊ะๆ
                for (let item of textContent.items) {
                    const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
                    
                    const textSpan = document.createElement('span');
                    textSpan.style.position = 'absolute';
                    textSpan.style.left = tx[4] + 'px';
                    textSpan.style.top = (viewport.height - tx[5] - (item.height * 0.8)) + 'px';
                    textSpan.style.fontSize = (item.height * 0.9) + 'px';
                    textSpan.style.fontFamily = "'Padauk', 'Sarabun', sans-serif";
                    textSpan.style.whiteSpace = 'nowrap';
                    textSpan.style.color = '#000';
                    
                    // สั่งแปลภาษาไทยตรงจุดนั้นให้กลายเป็นพม่า
                    const translatedText = await translateToMyanmar(item.str);
                    textSpan.innerText = translatedText;
                    
                    pageDiv.appendChild(textSpan);
                }
                
                printArea.appendChild(pageDiv);
            }

            statusDiv.innerText = "✅ แปลงภาษาเสร็จสมบูรณ์! ระบบกำลังเปิดหน้าต่างสั่งพิมพ์...";
            
            // สั่งให้ระบบ "เด้ง" หน้าต่างพิมพ์เอกสาร (Print Dialogue) ของคอมพิวเตอร์ขึ้นมาทันทีอัตโนมัติ
            setTimeout(() => {
                window.print();
                processBtn.disabled = false;
            }, 1000);

        } catch (error) {
            alert("เกิดข้อผิดพลาดในการอ่านไฟล์ PDF: " + error.message);
            processBtn.disabled = false;
            statusDiv.innerText = "";
        }
    });
</script>

</body>
</html>
