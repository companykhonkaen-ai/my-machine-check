<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>โปรแกรมแปลภาษาใบสั่งทอภาษาไทย-พม่า แผนกทอ E</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Sarabun', 'Padauk', -apple-system, BlinkMacSystemFont, sans-serif;
            /* พื้นหลังสไตล์เทคโนโลยีล้ำสมัย ไล่เฉดสีน้ำเงินเข้ม-ดำประกายไซเบอร์ */
            background: radial-gradient(circle at top, #1a2035 0%, #0a0c16 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        
        .container {
            /* หน้าต่างกระจกโปร่งแสงสุดหรู (Glassmorphic Tech Style) */
            background: rgba(20, 25, 45, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px 25px;
            border-radius: 16px;
            border: 1px solid rgba(0, 180, 216, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px 0 rgba(0, 180, 216, 0.1);
            max-width: 550px;
            width: 100%;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 25px;
        }
        
        h2 { 
            color: #00f0ff; /* สีฟ้านีออนเทคโนโลยี */
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-top: 0; 
            font-size: 1.4rem; 
            font-weight: 600; 
            line-height: 1.4;
        }
        
        .instruction-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #00f0ff;
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            text-align: left;
        }
        
        p { 
            color: #b4c6ef; 
            font-size: 13.5px; 
            line-height: 1.6; 
            margin: 0;
        }
        
        .file-input-wrapper { margin: 25px 0 15px 0; }
        input[type="file"] { display: none; }
        
        .custom-file-upload {
            border: 2px dashed #00b4d8;
            display: block;
            padding: 22px 15px;
            cursor: pointer;
            border-radius: 10px;
            color: #00f0ff;
            font-weight: bold;
            background: rgba(0, 180, 216, 0.05);
            transition: all 0.3s ease;
            font-size: 15px;
            box-shadow: inset 0 0 10px rgba(0, 180, 216, 0.1);
        }
        .custom-file-upload:hover, .custom-file-upload:active { 
            background: rgba(0, 180, 216, 0.15); 
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        
        button {
            padding: 15px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            border: none;
            display: block;
            outline: none;
            transition: all 0.2s ease;
        }
        
        #process-btn { 
            background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%);
            color: white; 
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
        }
        #process-btn:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }
        #process-btn:disabled { 
            background: #252d3d; 
            color: #5c6b84; 
            border: 1px solid #1a2233;
            box-shadow: none;
            cursor: not-allowed; 
        }
        
        #download-btn { 
            background: linear-gradient(135deg, #0f9b0f 0%, #28a745 100%); 
            color: white; 
            display: none; 
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(40, 167, 69, 0.6); }
            100% { transform: scale(1); }
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            color: #00f0ff;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
        }
        
        #preview-container {
            width: 100%;
            max-width: 830px;
            overflow-x: auto;
            background: #101424;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #1a2233;
            display: none;
            margin-top: 10px;
        }
        
        #print-area { 
            background: white; 
            width: 800px; 
            margin: 0 auto;
        }
        
        .pdf-page {
            position: relative;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            page-break-after: always;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚙️ โปรแกรมแปลภาษาใบสั่งทอภาษาไทย-พม่า<br>แผนกทอ E</h2>
        
        <div class="instruction-box">
            <p><strong>วิธีใช้:</strong> กดเลือกไฟล์ PDF ใบสั่งทอจากนั้นกดปุ่มประมวลผล แล้วรอสักครู่ข้อมูลกำลังประมวลผลแปลคำศัพท์และเด้งหน้าต่างดาวโหลดไฟล์</p>
        </div>
        
        <div class="file-input-wrapper">
            <label class="custom-file-upload">
                <input type="file" id="pdf-file" accept=".pdf">
                📁 เลือกไฟล์ PDF ใบสั่งทอ
            </label>
            <div id="file-name" style="margin-top: 10px; font-size: 12px; color: #8fa0c4; word-break: break-all;">ยังไม่ได้เลือกไฟล์</div>
        </div>

        <div class="btn-group">
            <button id="process-btn" disabled>🚀 เริ่มประมวลผลแปลภาษา</button>
            <button id="download-btn">📥 ดาวน์โหลดไฟล์ PDF ภาษาพม่าสำเร็จ</button>
        </div>
        <div id="status"></div>
    </div>

    <div id="preview-container">
        <div style="color: #00f0ff; font-size: 13px; margin-bottom: 10px; text-align: center; font-weight: bold;">📊 เอกสารจำลองเวอร์ชันภาษาพม่า (รูปแบบเดิม)</div>
        <div id="print-area"></div>
    </div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const fileInput = document.getElementById('pdf-file');
    const fileNameDiv = document.getElementById('file-name');
    const processBtn = document.getElementById('process-btn');
    const downloadBtn = document.getElementById('download-btn');
    const statusDiv = document.getElementById('status');
    const previewContainer = document.getElementById('preview-container');
    const printArea = document.getElementById('print-area');

    let rawFileData = null;

    fileInput.addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            const file = e.target.files[0];
            fileNameDiv.innerText = "📁 ไฟล์ที่พร้อมประมวลผล: " + file.name;
            processBtn.disabled = false;
            downloadBtn.style.display = "none";
            previewContainer.style.display = "none";
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                rawFileData = evt.target.result;
            };
            reader.readAsArrayBuffer(file);
        }
    });

    async function translateToMyanmar(text) {
        if (!text || text.trim() === "" || !isNaN(text) || text.trim().length < 2) return text;
        if (/^[A-Za-z0-9\-\/\s\*\.\:\,]+$/.test(text.trim())) return text;

        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl=my&dt=t&q=${encodeURIComponent(text.trim())}`;
            const response = await fetch(url);
            const data = await response.json();
            if (data && data[0] && data[0][0]) {
                return data[0][0][0];
            }
        } catch (error) {
            console.error("การแปลระบบขัดข้อง:", error);
        }
        return text;
    }

    processBtn.addEventListener('click', async function() {
        if (!rawFileData) return;
        
        processBtn.disabled = true;
        statusDiv.innerText = "⏳ กำลังประมวลผลแปลคำศัพท์...";
        printArea.innerHTML = ""; 

        try {
            const bufferCopy = rawFileData.slice(0);
            const loadingTask = pdfjsLib.getDocument({data: bufferCopy});
            const pdf = await loadingTask.promise;
            
            for (let i = 1; i <= pdf.numPages; i++) {
                statusDiv.innerText = `⏳ ข้อมูลกำลังประมวลผลแปลคำศัพท์ หน้าที่ ${i}/${pdf.numPages}...`;
                const page = await pdf.getPage(i);
                
                const textContent = await page.getTextContent();
                const viewport = page.getViewport({scale: 1.3});
                
                const pageDiv = document.createElement('div');
                pageDiv.className = 'pdf-page';
                pageDiv.style.width = viewport.width + 'px';
                pageDiv.style.height = viewport.height + 'px';
                
                for (let item of textContent.items) {
                    const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
                    
                    const textSpan = document.createElement('span');
                    textSpan.style.position = 'absolute';
                    textSpan.style.left = tx[4] + 'px';
                    textSpan.style.top = (viewport.height - tx[5] - (item.height * 0.8)) + 'px';
                    textSpan.style.fontSize = (item.height * 0.9) + 'px';
                    textSpan.style.fontFamily = "'Padauk', 'Sarabun', sans-serif";
                    textSpan.style.whiteSpace = 'nowrap';
                    textSpan.style.color = '#000';
                    textSpan.style.lineHeight = '1';
                    
                    const translatedText = await translateToMyanmar(item.str);
                    textSpan.innerText = translatedText;
                    
                    pageDiv.appendChild(textSpan);
                }
                printArea.appendChild(pageDiv);
            }

            statusDiv.innerText = "✅ ประมวลผลเสร็จสิ้น! หน้าต่างดาวน์โหลดไฟล์พร้อมใช้งานแล้ว";
            processBtn.disabled = false;
            downloadBtn.style.display = "block";
            previewContainer.style.display = "block";

            // สั่งทริกเกอร์ดาวน์โหลดอัตโนมัติทันทีตามที่คำสั่งต้องการ
            triggerDownload();

        } catch (error) {
            alert("ระบบขัดข้อง: " + error.message);
            processBtn.disabled = false;
            statusDiv.innerText = "";
        }
    });

    downloadBtn.addEventListener('click', function() {
        triggerDownload();
    });

    function triggerDownload() {
        statusDiv.innerText = "📥 กำลังเด้งหน้าต่างดาวน์โหลดเซฟไฟล์ลงเครื่อง...";
        
        const opt = {
            margin:       0,
            filename:     'ใบสั่งทอ_แผนกทอE_พม่า.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
            jsPDF:        { unit: 'pt', format: 'a4', orientation: 'portrait' }
        };
        
        html2pdf().set(opt).from(printArea).save().then(() => {
            statusDiv.innerText = "✅ ดาวน์โหลดสำเร็จเรียบร้อย!";
        }).catch(err => {
            alert("การเซฟไฟล์ขัดข้อง: " + err.message);
            statusDiv.innerText = "";
        });
    }
</script>

</body>
</html>
