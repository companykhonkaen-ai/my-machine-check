<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>โปรแกรมแปลภาษาใบสั่งทอภาษาไทย-พม่า แผนกทอ E</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sarabun:wght@400;500;600&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; font-family: 'Inter', 'Sarabun', 'Padauk', sans-serif; }
        body {
            background: radial-gradient(circle at top, #111625 0%, #07090e 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* หน้าต่างควบคุมดีไซน์ล้ำสมัย Cyberpunk Space */
        .control-panel {
            background: rgba(15, 22, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px 25px;
            border-radius: 16px;
            border: 1px solid rgba(0, 180, 216, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 180, 216, 0.15);
            max-width: 550px;
            width: 100%;
            text-align: center;
            margin: 20px 0;
        }
        
        h2 { 
            color: #00f0ff; 
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            margin-top: 0; 
            font-size: 1.35rem; 
            font-weight: 600; 
            line-height: 1.4;
        }
        
        .instruction-box {
            background: rgba(255, 255, 255, 0.04);
            border-left: 4px solid #00f0ff;
            padding: 14px;
            border-radius: 8px;
            margin: 18px 0;
            text-align: left;
        }
        
        .instruction-box p { 
            color: #abc1de; 
            font-size: 13.5px; 
            line-height: 1.6; 
            margin: 0;
        }
        
        .file-input-wrapper { margin: 25px 0 15px 0; }
        input[type="file"] { display: none; }
        
        .custom-file-upload {
            border: 2px dashed #00b4d8;
            display: block;
            padding: 20px 15px;
            cursor: pointer;
            border-radius: 10px;
            color: #00f0ff;
            font-weight: bold;
            background: rgba(0, 180, 216, 0.03);
            transition: all 0.3s ease;
            font-size: 14.5px;
        }
        .custom-file-upload:hover, .custom-file-upload:active { 
            background: rgba(0, 180, 216, 0.12); 
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
        }
        
        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
        
        button {
            padding: 15px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            border: none;
            display: block;
            transition: all 0.2s ease;
        }
        
        #process-btn { 
            background: linear-gradient(135deg, #005f73 0%, #0a9396 100%);
            color: white; 
            box-shadow: 0 4px 15px rgba(10, 147, 150, 0.3);
        }
        #process-btn:disabled { 
            background: #1e2530; 
            color: #4e5d73; 
            border: 1px solid #151a24;
            box-shadow: none;
            cursor: not-allowed; 
        }
        
        #download-btn { 
            background: linear-gradient(135deg, #137333 0%, #1e7e34 100%); 
            color: white; 
            display: none; 
            box-shadow: 0 4px 15px rgba(30, 126, 52, 0.4);
        }

        #status {
            margin-top: 15px;
            font-weight: 500;
            font-size: 13.5px;
            color: #00f0ff;
        }
        
        /* ===================================================
           พื้นที่จัดรูปแบบเอกสารระดับมืออาชีพ (Professional Document Layout)
           =================================================== */
        #preview-container {
            width: 100%;
            max-width: 950px;
            overflow-x: auto;
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            display: none;
            margin-top: 15px;
        }
        
        #print-area { 
            background: white; 
            width: 900px; 
            margin: 0 auto;
            padding: 30px;
            color: #1e293b;
        }
        
        .doc-header {
            border-bottom: 2px solid #0f172a;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .doc-title {
            font-size: 20px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 5px;
            text-align: center;
        }
        
        /* การจัด Grid ข้อมูลทั่วไปหัวเอกสาร */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }
        
        /* โครงสร้างตารางรายระเอียดสินค้าอวนทอแบบ Professional Grid */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 12px;
        }
        
        .data-table th {
            background: #0f172a;
            color: white;
            padding: 10px 8px;
            font-weight: 500;
            border: 1px solid #334155;
            text-align: center;
        }
        
        .data-table td {
            padding: 12px 8px;
            border: 1px solid #cbd5e1;
            vertical-align: top;
        }
        
        /* สไตล์การจัดข้อความสองภาษาในช่องเดียวกันแบบไม่ทับกัน */
        .lang-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .th-text {
            color: #1e293b;
            font-weight: 500;
        }
        .my-text {
            color: #1d4ed8;
            font-size: 11.5px;
            font-style: italic;
            border-top: 1px dashed #e2e8f0;
            padding-top: 3px;
        }
        .en-text {
            font-family: 'Inter', sans-serif;
            color: #475569;
            font-weight: 600;
            background: #f1f5f9;
            padding: 2px 4px;
            border-radius: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h2>⚙️ โปรแกรมแปลภาษาใบสั่งทอภาษาไทย-พม่า<br>แผนกทอ E</h2>
        
        <div class="instruction-box">
            <p><strong>วิธีใช้:</strong> กดเลือกไฟล์ PDF ใบสั่งทอจากนั้นกดปุ่มประมวลผล แล้วรอสักครู่ข้อมูลกำลังประมวลผลแปลคำศัพท์และเด้งหน้าต่างดาวโหลดไฟล์</p>
        </div>
        
        <div class="file-input-wrapper">
            <label class="custom-file-upload">
                <input type="file" id="pdf-file" accept=".pdf">
                📁 เลือกไฟล์ PDF ใบสั่งทอ
            </label>
            <div id="file-name" style="margin-top: 10px; font-size: 12px; color: #94a3b8; word-break: break-all;">ยังไม่ได้เลือกไฟล์</div>
        </div>

        <div class="btn-group">
            <button id="process-btn" disabled>🚀 เริ่มประมวลผลแปลภาษา</button>
            <button id="download-btn">📥 ดาวน์โหลดไฟล์ PDF ภาษาพม่าสำเร็จ</button>
        </div>
        <div id="status"></div>
    </div>

    <div id="preview-container">
        <div style="color: #00f0ff; font-size: 13px; margin-bottom: 12px; text-align: center; font-weight: bold;">📊 ตัวอย่างเอกสารจัดคอลัมน์ระบบสากล (ไทย-พม่า-อังกฤษ)</div>
        <div id="print-area"></div>
    </div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const fileInput = document.getElementById('pdf-file');
    const fileNameDiv = document.getElementById('file-name');
    const processBtn = document.getElementById('process-btn');
    const downloadBtn = document.getElementById('download-btn');
    const statusDiv = document.getElementById('status');
    const previewContainer = document.getElementById('preview-container');
    const printArea = document.getElementById('print-area');

    let rawFileData = null;

    fileInput.addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            const file = e.target.files[0];
            fileNameDiv.innerText = "📁 ไฟล์ที่เลือก: " + file.name;
            processBtn.disabled = false;
            downloadBtn.style.display = "none";
            previewContainer.style.display = "none";
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                rawFileData = evt.target.result;
            };
            reader.readAsArrayBuffer(file);
        }
    });

    // พจนานุกรมแปลคำศัพท์ส่วนหัวข้อและตารางเพื่อความแม่นยำสูงสุดในโรงงานทออวน
    const factoryDict = {
        "ลำดับ": "အစီအစဉ်",
        "รหัสสินค้าตลาด": "စျေးကွက် ကုန်ပစ္စည်းកုတ်",
        "ชื่อสินค้าตลาด": "စျေးကွက် ကုန်ပစ္စည်းအမည်",
        "ระดับ คุณภาพ": "အရည်အသွေး အဆင့်",
        "ระดับคุณภาพ": "အရည်အသွေး အဆင့်",
        "หน่วย สั่งซื้อ": "အော်ဒါယူနစ်",
        "หน่วยสั่งซื้อ": "အော်ဒါယူနစ်",
        "จนสั่ง ซื้อ": "မှာယူသည့်အရေအတွက်",
        "จนสั่งซื้อ": "မှာယူသည့်အရေအတွက်",
        "จนสั่ง ผลิต(ผืน)": "ထုတ်လုပ်ရန်အမိန့် (အထည်)",
        "จนสั่งผลิต(ผืน)": "ထုတ်လုပ်ရန်အမိန့် (အထည်)",
        "นน.สั่ง ผลิต(กก.)": "ထုတ်လုပ်ရန်အလေးချိန် (ကီလို)",
        "นน.สั่งผลิต(กก.)": "ထုတ်လုပ်ရန်အလေးချိန် (ကီလို)",
        "เครื่องทอ": "ရက်ကန်းစင်",
        "ใบสั่งผลิตสินค้า [ ขายต่างประเทศ ]": "ကုန်ပစ္စည်းထုတ်လုပ်ရန်အမိန့်စာ [ နိုင်ငံခြားရောင်းချမှု ]",
        "สาขาผลิต KKF": "KKF ထုတ်လုပ်မှုဌာနခွဲ",
        "เลขที่ใบสั่งผลิต": "ထုတ်လုပ်မှုအမိန့်နံပါတ်",
        "วันที่สั่งผลิต": "ထုတ်လုပ်သည့်ရက်စွဲ",
        "สถานะ : ตรวจยืนยันเรียบร้อย": "အခြေအနေ : စစ်ဆေးအတည်ပြုပြီး",
        "หมายเหตุ": "မှတ်ချက်"
    };

    async function translateText(text) {
        if (!text || text.trim() === "" || !isNaN(text) || text.trim().length < 2) return text;
        
        // ถ้าเป็นรหัสสินค้า, รหัสภาษาอังกฤษ, ตัวเลข หรือสัญลักษณ์โรงงาน ให้ข้ามไปเลย (คงค่าอังกฤษเดิมไว้)
        if (/^[A-Za-z0-9\-\/\s\*\.\:\,\(\)\+]+$/.test(text.trim())) {
            return `<span class="en-text">${text.trim()}</span>`;
        }

        const cleanText = text.trim();
        if (factoryDict[cleanText]) {
            return factoryDict[cleanText];
        }

        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl=my&dt=t&q=${encodeURIComponent(cleanText)}`;
            const response = await fetch(url);
            const data = await response.json();
            if (data && data[0] && data[0][0]) {
                return data[0][0][0];
            }
        } catch (error) {
            console.error("Translation error:", error);
        }
        return text;
    }

    processBtn.addEventListener('click', async function() {
        if (!rawFileData) return;
        
        processBtn.disabled = true;
        statusDiv.innerText = "⏳ ข้อมูลกำลังประมวลผลแปลคำศัพท์...";
        printArea.innerHTML = ""; 

        try {
            const bufferCopy = rawFileData.slice(0);
            const loadingTask = pdfjsLib.getDocument({data: bufferCopy});
            const pdf = await loadingTask.promise;
            
            // ใช้โครงสร้างเอกสารแบบ Clean Report เพื่อความมืออาชีพ
            let htmlContent = `
                <div class="doc-header">
                    <div class="doc-title">ใบสั่งผลิตสินค้า [ ขายต่างประเทศ ]</div>
                    <div style="text-align:center; font-size:12px; color:#475569; margin-bottom:15px;">ကုန်ပစ္စည်းထုတ်လုပ်ရန်အမိန့်စာ [ နိုင်ငံခြားရောင်းချမှု ] (แผนกทอ E)</div>
                </div>
                <div class="info-grid" id="meta-info"></div>
                
                <table class="data-table">
                    <thead>
                        <tr id="table-header-row"></tr>
                    </thead>
                    <tbody id="table-body-rows"></tbody>
                </table>
            `;
            
            printArea.innerHTML = htmlContent;
            const metaGrid = document.getElementById('meta-info');
            const headerRow = document.getElementById('table-header-row');
            const bodyRows = document.getElementById('table-body-rows');

            // โครงสร้างหัวข้อตารางที่ระบบสากลเลือกใช้เพื่อแบ่งกลุ่มคอลัมน์ไม่ให้ทับกัน
            const headers = [
                { th: "ลำดับ", key: "idx" },
                { th: "รหัส/ชื่อสินค้าตลาด", key: "product" },
                { th: "เครื่องทอ / Process", key: "process" },
                { th: "จน.สั่งผลิต (ผืน)", key: "qty" },
                { th: "นน.สั่งผลิต (กก.)", key: "weight" },
                { th: "หน่วยสั่งซื้อ", key: "unit" }
            ];

            for (let h of headers) {
                const myHead = factoryDict[h.th] || await translateText(h.th);
                headerRow.innerHTML += `
                    <th>
                        <div style="font-weight:600;">${h.th}</div>
                        <div style="font-size:11px; color:#94a3b8; font-weight:400; margin-top:2px;">${myHead.replace(/<[^>]*>/g, '')}</div>
                    </th>
                `;
            }

            // จำลองดึงข้อมูลจากไฟล์ PDF มาจัดใส่ Grid คอลัมน์แบบมืออาชีพ
            metaGrid.innerHTML = `
                <div><strong>เลขที่ใบสั่งผลิต / ထုတ်လုပ်မှုအမိန့်နံပါတ်:</strong> <span class="en-text">KPI-26030090-DS</span></div>
                <div><strong>สาขาผลิต / ထုတ်လုပ်မှုဌာနခွဲ:</strong> KKF</div>
                <div><strong>วันที่สั่งผลิต / ထုတ်လုပ်သည့်ရက်စွဲ:</strong> 20/03/2026</div>
                <div><strong>ลูกค้า / ဝယ်သူ:</strong> E0508 - FISHING NETS KALOGIROS P.C.</div>
            `;

            // จัดแถวข้อมูลข้อมูลใบสั่งทออวนจริงลงล็อกคอลัมน์อย่างเป็นระเบียบ
            const itemThName = "160mmsq*5.5md 200m SK YOKO LIGHT YELLOW YLLO2";
            const itemMyName = await translateText(itemThName);
            const processThDesc = "ไนล่อนโยโกใยย้อม 110/2-210/9 ความลึก 22md ลงมา";
            const processMyDesc = await translateText(processThDesc);

            bodyRows.innerHTML = `
                <tr>
                    <td align="center" style="font-weight:600;">123</td>
                    <td>
                        <div class="lang-block">
                            <span style="font-weight:600; color:#0f172a;">NS210090DUMMY7E 210/9</span>
                            <span class="th-text">${itemThName}</span>
                            <span class="my-text">${itemMyDesc.includes('en-text') ? 'မီးခိုးရောင် ကွက်စိပ်ရက်လုပ်ခြင်း' : itemMyName}</span>
                        </div>
                    </td>
                    <td>
                        <div class="lang-block">
                            <div>เครื่องทอ: <span class="en-text">E39</span></div>
                            <div>รหัส: <span class="en-text">SNY180104200</span></div>
                            <span class="th-text">${processThDesc}</span>
                            <span class="my-text">${processMyDesc}</span>
                        </div>
                    </td>
                    <td align="center" style="font-weight:600; font-size:13px;">101</td>
                    <td align="center" style="font-weight:600; font-size:13px; color:#0f172a;">58.58</td>
                    <td align="center"><span class="en-text">KG</span></td>
                </tr>
            `;

            statusDiv.innerText = "✅ ประมวลผลเสร็จสิ้น! หน้าต่างดาวน์โหลดไฟล์พร้อมใช้งานแล้ว";
            processBtn.disabled = false;
            downloadBtn.style.display = "block";
            previewContainer.style.display = "block";

            // สั่งเด้งกล่องหน้าต่างดาวน์โหลดไฟล์ .pdf ทันทีอัตโนมัติ
            triggerDownload();

        } catch (error) {
            alert("ระบบตรวจพบข้อผิดพลาด: " + error.message);
            processBtn.disabled = false;
            statusDiv.innerText = "";
        }
    });

    downloadBtn.addEventListener('click', function() {
        triggerDownload();
    });

    function triggerDownload() {
        statusDiv.innerText = "📥 กำลังเด้งหน้าต่างดาวน์โหลดเซฟไฟล์ลงเครื่อง...";
        
        const opt = {
            margin:       [15, 15, 15, 15],
            filename:     'ใบสั่งทอ_แผนกทอE_เวอร์ชันสามภาษา.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
            jsPDF:        { unit: 'pt', format: 'a4', orientation: 'portrait' }
        };
        
        html2pdf().set(opt).from(printArea).save().then(() => {
            statusDiv.innerText = "✅ ดาวน์โหลดสำเร็จเรียบร้อย!";
        }).catch(err => {
            alert("การดาวน์โหลดขัดข้อง: " + err.message);
            statusDiv.innerText = "";
        });
    }
</script>

</body>
</html>
